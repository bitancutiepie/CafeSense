<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CaféSense | Login</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/pages/login.css">

    <!-- JavaScript -->
    <script src="../assets/js/pages/login.js" defer></script>
</head>

<body>

    <main class="login-container">

        <!-- ==========================================
             LOGIN FORM
        =========================================== -->
        <section class="login-card" id="login-card">

            <h1 class="brand-name">CaféSense</h1>

            <form id="login-form">

                <!-- USERNAME OR EMAIL -->
                <div class="input-group">
                    <input
                        type="text"
                        id="username"
                        placeholder="Username or Email"
                        autocomplete="username"
                        required
                    >
                </div>

                <!-- PASSWORD -->
                <div class="input-group password-input">
                    <input
                        type="password"
                        id="login-password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="login-password"
                    >
                        Show
                    </button>
                </div>

                <!-- FORGOT PASSWORD -->
                <div class="forgot-password">
                    <a href="#" id="forgot-password">
                        Forgot Password?
                    </a>
                </div>

                <!-- LOGIN BUTTON -->
                <button type="submit" class="main-button">
                    Login
                </button>

                <!-- LOGIN MESSAGE -->
                <p id="login-message" class="message"></p>

            </form>

            <!-- REGISTRATION LINK -->
            <p class="account-text">
                Don't have an account?
                <a href="#" class="switch-link" id="show-register">
                    Create an Account
                </a>
            </p>

        </section>


        <!-- ==========================================
             REGISTRATION FORM
        =========================================== -->
        <section class="login-card register-card hidden" id="register-card">

            <h1 class="brand-name">CaféSense</h1>

            <form id="register-form">

                <!-- FULL NAME -->
                <div class="input-group">
                    <input
                        type="text"
                        id="fullname"
                        placeholder="Full Name"
                        autocomplete="name"
                        required
                    >
                </div>

                <!-- USERNAME -->
                <div class="input-group">
                    <input
                        type="text"
                        id="new-username"
                        placeholder="Username"
                        autocomplete="username"
                        required
                    >
                </div>

                <!-- EMAIL ADDRESS -->
                <div class="input-group">
                    <input
                        type="email"
                        id="email"
                        placeholder="Email Address"
                        autocomplete="email"
                        required
                    >
                </div>

                <!-- ACCOUNT TYPE -->
                <div class="input-group">
                    <select id="role" required>
                        <option value="">Select Account Type</option>
                        <option value="Owner">Owner</option>
                        <option value="Manager">Manager</option>
                        <option value="Staff">Staff</option>
                    </select>
                </div>

                <!-- CREATE PASSWORD -->
                <div class="input-group password-input">
                    <input
                        type="password"
                        id="new-password"
                        placeholder="Create Password (at least 8 characters)"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="new-password"
                    >
                        Show
                    </button>
                </div>

                <!-- CONFIRM PASSWORD -->
                <div class="input-group password-input">
                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm Password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="confirm-password"
                    >
                        Show
                    </button>
                </div>

                <!-- REGISTER BUTTON -->
                <button type="submit" class="main-button">
                    Create Account
                </button>

                <!-- REGISTRATION MESSAGE -->
                <p id="register-message" class="message"></p>

            </form>

            <!-- LOGIN LINK -->
            <p class="account-text">
                Already have an account?
                <a href="#" class="switch-link" id="show-login">
                    Login
                </a>
            </p>

        </section>

    </main>

</body>
</html>
